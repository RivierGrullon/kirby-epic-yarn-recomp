name: Update Linux tools

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing game release receiving the tools (for example, v0.2.0-alpha.1)'
        required: true
        type: string
      force:
        description: 'Rebuild even if tracked inputs are unchanged (for example, system package updates)'
        default: false
        type: boolean
      publish:
        description: 'Attach verified tools to the selected existing game release'
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: update-linux-tools-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  TARGET_RELEASE_TAG: ${{ inputs.release_tag }}
  TOOLS_ASSET_ID: ${{ github.run_id }}

jobs:
  build:
    name: Build reusable Linux tools
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      built: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check tools inputs and existing game release
        id: check
        env:
          FORCE_REBUILD: ${{ inputs.force }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/release_toolchain.py archive-url --repository "$GITHUB_REPOSITORY" --tag "$TARGET_RELEASE_TAG" --asset-id "$TOOLS_ASSET_ID"
          changed=$(python3 tools/release_toolchain.py changed)
          if [ "$changed" = false ] && [ "$FORCE_REBUILD" = false ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo 'Tools inputs are unchanged; reuse the current published tools. Select force to rebuild system packages.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TARGET_RELEASE_TAG" > "$RUNNER_TEMP/linux-tools-target-release.json"
          python3 tools/release_toolchain.py check-release --tag "$TARGET_RELEASE_TAG" --asset-id "$TOOLS_ASSET_ID" \
            --release-json "$RUNNER_TEMP/linux-tools-target-release.json"
          echo "build=true" >> "$GITHUB_OUTPUT"
      - name: Build tools images
        if: steps.check.outputs.build == 'true'
        run: |
          docker build --pull -f tools/Containerfile -t localhost/kirby-native-toolchain:stage1 tools
          docker build -f tools/Containerfile.portable -t localhost/kirby-portable-tools:compact tools
      - name: Export tools and verify replacement pin
        if: steps.check.outputs.build == 'true'
        run: |
          python3 tools/release_toolchain.py build --engine docker --output local/releases/tools \
            --repository "$GITHUB_REPOSITORY" --tag "$TARGET_RELEASE_TAG" --asset-id "$TOOLS_ASSET_ID"
          (cd local/releases/tools && sha256sum --check ./*.sha256)
          {
            echo 'Built tools archive, verified descriptors and SHA-256 files.'
            echo 'When publish is enabled, files are attached to the selected existing game release; no release or tag is created.'
            echo 'After uploading, review and copy artifact toolchain-release.json to packaging/linux/toolchain-release.json in a separate change.'
            echo 'Installer releases keep using the current pin until that change is merged.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain tools and proposed pin for review
        if: steps.check.outputs.build == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-tools
          path: local/releases/tools/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Attach tools to existing game release
    needs: build
    if: inputs.publish && needs.build.outputs.built == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-tools
          path: tools-release
      - name: Verify destination and attach tools without replacing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd tools-release && sha256sum --check ./*.sha256)
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TARGET_RELEASE_TAG" > "$RUNNER_TEMP/linux-tools-target-release.json"
          python3 tools/release_toolchain.py check-release --tag "$TARGET_RELEASE_TAG" --asset-id "$TOOLS_ASSET_ID" \
            --release-json "$RUNNER_TEMP/linux-tools-target-release.json"
          gh release upload "$TARGET_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            tools-release/Kirby-tools-linux-x86_64-"$TOOLS_ASSET_ID".tar.xz \
            tools-release/Kirby-tools-linux-x86_64-"$TOOLS_ASSET_ID".tar.xz.sha256 \
            tools-release/Kirby-tools-linux-x86_64-"$TOOLS_ASSET_ID".tar.xz.json \
            tools-release/Kirby-tools-linux-x86_64-"$TOOLS_ASSET_ID".tar.xz.json.sha256
