name: Release installers

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event.release.tag_name }}

jobs:
  linux:
    name: Linux x86_64 installers
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify published tools descriptor and inputs
        run: python3 tools/release_toolchain.py resolve --output local/releases/tools.json
      - uses: ./.github/actions/build-qt-launcher
      - name: Prepare packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools libegl1 libgl1 libopengl0 libxkbcommon0 libfontconfig1
          docker build --build-arg TOOLS_IMAGE=ubuntu:24.04 -f tools/Containerfile.setup -t localhost/kirby-setup-tools:pyqt tools
      - name: Build Linux setup and AppImage
        run: |
          out=local/releases
          setup=Kirby-Setup-linux-x86_64
          mkdir -p "$out"
          python3 tools/package_portable.py --engine docker --output "$out/$setup" --tools-descriptor "$out/tools.json" --qt-frontend "$RUNNER_TEMP/qt-launcher"
          python3 tools/build_appimage.py "$out/$setup" --output "$out/$setup.AppImage"
          tar -czf "$out/$setup.tar.gz" -C "$out" "$setup"
          (cd "$out" && sha256sum "$setup.tar.gz" > "$setup.tar.gz.sha256")
      - name: Test packaged installers
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          setup=Kirby-Setup-linux-x86_64
          local/releases/"$setup".AppImage --appimage-extract-and-run --self-test
          local/releases/"$setup".AppImage --appimage-extract-and-run --bridge-help
          image=$(realpath local/releases/"$setup".AppImage)
          (cd "$RUNNER_TEMP" && "$image" --appimage-extract >/dev/null && squashfs-root/tools/qt-launcher/kirby-ui --self-test)
          tar -xzf local/releases/"$setup".tar.gz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/$setup/AppRun" --self-test
          "$RUNNER_TEMP/$setup/tools/qt-launcher/kirby-ui" --self-test
          "$RUNNER_TEMP/$setup/Play-Kirby.sh" --bridge-help
      - name: Attach Linux installers to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The version goes in the uploaded names, so a downloaded file says which release it is.
          # Checksums are made again here because each one names its file.
          version="${RELEASE_TAG#v}"
          if [[ ! "$version" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Tag $RELEASE_TAG can't be used in a file name" >&2
            exit 1
          fi
          cd local/releases
          files=()
          for kind in AppImage tar.gz; do
            name="Kirby-Setup-$version-linux-x86_64.$kind"
            mv "Kirby-Setup-linux-x86_64.$kind" "$name"
            sha256sum "$name" > "$name.sha256"
            files+=("$name" "$name.sha256")
          done
          gh release upload "$RELEASE_TAG" --clobber "${files[@]}"

  windows:
    name: Windows x86_64 setup
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install setup dependencies
        run: python -m pip install -r tools/requirements-setup.txt
      - uses: ./.github/actions/build-qt-launcher
      - name: Build and test Windows setup
        run: python tools/windows/package_setup.py --output local/releases/Kirby-Setup-windows-x86_64 --qt-frontend "$env:RUNNER_TEMP/qt-launcher"
      - name: Checksum the Windows setup ZIP
        working-directory: local/releases
        shell: pwsh
        run: |
          $archive = "Kirby-Setup-windows-x86_64.zip"
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content "$archive.sha256" -Encoding ascii
      - name: Smoke-test the frontend from the extracted ZIP
        shell: pwsh
        run: |
          $folder = 'Kirby-Setup-windows-x86_64'
          $unpack = Join-Path $env:RUNNER_TEMP 'setup-zip-test'
          Expand-Archive "local/releases/$folder.zip" $unpack
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:PATH = "$env:SystemRoot\System32"
          $exe = Join-Path $unpack "$folder/tools/qt-launcher/kirby-ui.exe"
          exit (Start-Process $exe -ArgumentList '--self-test' -Wait -PassThru).ExitCode
      - name: Attach Windows setup to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The version goes in the uploaded name, as on Linux; the checksum names its file.
          $version = $env:RELEASE_TAG -replace '^v', ''
          if ($version -notmatch '^[A-Za-z0-9._-]+$') { throw "Tag $env:RELEASE_TAG can't be used in a file name" }
          Set-Location local/releases
          $archive = "Kirby-Setup-$version-windows-x86_64.zip"
          Move-Item Kirby-Setup-windows-x86_64.zip $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content "$archive.sha256" -Encoding ascii
          gh release upload "$env:RELEASE_TAG" --clobber $archive "$archive.sha256"
