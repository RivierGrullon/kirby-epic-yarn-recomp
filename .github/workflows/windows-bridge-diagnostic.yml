name: Windows release bridge diagnostic

on:
  push:
    branches: [codex/kirby-windows-bridge-diagnostic]

permissions:
  contents: read

jobs:
  patched-bridge:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          architecture: x64
      - name: Freeze the patched ZIP
        shell: pwsh
        run: |
          python -m pip install -r tools/requirements-setup.txt
          python tools/windows/package_setup.py --output (Join-Path $env:RUNNER_TEMP 'Recomp Library/Kirby-Setup-windows-x86_64')
      - name: Verify frozen prepare from PowerShell 7 reaches game input validation
        shell: pwsh
        run: |
          @'
          import os
          from pathlib import Path
          import subprocess

          library = Path(os.environ["RUNNER_TEMP"]) / "Recomp Library"
          package = library / "Kirby-Setup-windows-x86_64"
          scratch = package / ".recomplauncher-tmp"
          scratch.mkdir()
          data = library / "Prueba USA" / "DATA"
          (data / "sys").mkdir(parents=True)
          (data / "sys" / "boot.bin").write_bytes(b"synthetic header")
          child_env = dict(os.environ, RECOMPLAUNCHER="1", RECOMPLAUNCHER_MODE="desktop",
                           TEMP=str(scratch), TMP=str(scratch), TMPDIR=str(scratch))
          destination = package / "Game"
          command = [package / "Kirby-Bridge.exe", "--prepare", "--game", data, "--destination", destination]
          if "PSMODULEPATH" not in child_env:
              raise SystemExit("The PowerShell 7 module path is required for this regression test")
          try:
              result = subprocess.run(command, cwd=package, env=child_env,
                                      creationflags=subprocess.CREATE_NO_WINDOW, timeout=530,
                                      capture_output=True, text=True, errors="replace")
              print(result.stdout, result.stderr, flush=True)
              print(f"Bridge exit code: {result.returncode}", flush=True)
              if result.returncode != 1 or "RK5E01 Rev 0 Wii boot header required" not in result.stderr:
                  raise SystemExit("Expected the patched bridge to prepare its tools and reject the synthetic header")
          finally:
              for log in destination.glob(".kirby/*/local/setup/logs/*.log"):
                  print(log.read_text(encoding="utf-8", errors="replace")[-12000:], flush=True)
          '@ | Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'kirby-release-bridge-probe.py')
          python (Join-Path $env:RUNNER_TEMP 'kirby-release-bridge-probe.py')
