name: Build the release Qt launcher
description: Compile the disc-independent C++ frontend and deploy its private runtime
runs:
  using: composite
  steps:
    - name: Install Linux Qt build and desktop dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build patchelf libgl1-mesa-dev libopengl0 libegl-dev libxkbcommon-dev \
          libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 \
          libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 libfontconfig1 xvfb xauth
    - name: Fetch the pinned desktop SDK and build the launcher
      shell: python
      run: |
        import os
        from pathlib import Path
        import subprocess
        import sys

        windows = os.name == 'nt'
        temp = Path(os.environ['RUNNER_TEMP'])
        venv = temp/'qt-sdk-tools'
        sdk = temp/'kirby-qt-sdk'
        subprocess.run([sys.executable, '-m', 'venv', venv], check=True)
        python = venv/('Scripts/python.exe' if windows else 'bin/python')
        subprocess.run([python, '-m', 'pip', 'install', 'aqtinstall==3.3.0'], check=True)
        aqt = [python, '-m', 'aqt']
        host = 'windows' if windows else 'linux'
        arch = 'win64_mingw' if windows else 'linux_gcc_64'
        archives = ['qtbase', 'qttools', 'qttranslations'] + ([] if windows else ['icu'])
        subprocess.run([*aqt, 'install-qt', host, 'desktop', '6.8.3', arch,
                        '--archives', *archives, '-O', sdk], cwd=temp, check=True)
        args = []
        if windows:
            subprocess.run([*aqt, 'install-tool', host, 'desktop', 'tools_mingw1310',
                            'qt.tools.win64_mingw1310', '-O', sdk], cwd=temp, check=True)
            args = ['--compiler', sdk/'Tools/mingw1310_64/bin/g++.exe']
        prefix = sdk/'6.8.3'/('mingw_64' if windows else 'gcc_64')
        subprocess.run([sys.executable, 'tools/deploy_qt_launcher.py', '--qt-prefix', prefix,
                        '--output', temp/'qt-launcher', *args], check=True)
    - name: Exercise the bundled X11 plugin
      if: runner.os == 'Linux'
      shell: bash
      run: xvfb-run -a env -u LD_LIBRARY_PATH -u QT_PLUGIN_PATH QT_QPA_PLATFORM=xcb "$RUNNER_TEMP/qt-launcher/kirby-ui" --self-test
